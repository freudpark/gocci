<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도교육청 정보자원통합 중간보고회 | PyhgoShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #3b82f6;
            --text-color: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            /* Disable selection */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #050505 100%);
        }

        .container {
            width: 98%;
            /* Increased width */
            max-width: 1600px;
            height: 96vh;
            /* Increased height */
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            background: linear-gradient(to right, #93c5fd, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.9;
        }

        .pdf-viewer {
            flex-grow: 1;
            width: 100%;
            border-radius: 8px;
            border: none;
            background: #000;
        }

        footer {
            margin-top: 4px;
            font-size: 0.75rem;
            opacity: 0.4;
            text-align: center;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 8px;
            }

            h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
    <div class="container">
        <header>
            <h1>경기도교육청 정보자원통합 중간보고회</h1>
        </header>

        <!-- #toolbar=0 disables the default Chrome PDF toolbar, which includes the download button -->
        <iframe src="geoci_225report.pdf#toolbar=0&navpanes=0&scrollbar=0" class="pdf-viewer" id="viewer">
            <p>Your browser does not support iframes.</p>
        </iframe>

        <footer>
            &copy; 2026 PyhgoShift Security Protocol. Authorized access only.
        </footer>
    </div>

    <script>
        // Additional protection layer
        document.addEventListener('keydown', function (e) {
            // Disable PrintScreen (not always possible, but good to try)
            if (e.key === 'PrintScreen') {
                e.preventDefault();
            }
            // Disable Save (Ctrl+S or Cmd+S)
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
            }
            // Disable Print (Ctrl+P or Cmd+P)
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
            }
            // Disable DevTools (F12, Ctrl+Shift+I)
            if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'i')) {
                e.preventDefault();
            }
        });

        // Block context menu even on iframe (though it's harder in cross-origin, same-origin works better)
        const iframe = document.getElementById('viewer');
        iframe.onload = function () {
            try {
                iframe.contentWindow.addEventListener('contextmenu', function (e) {
                    e.preventDefault();
                }, false);
            } catch (e) {
                // If cross-origin restrictions apply, this catch will trigger.
                // But since it's same-origin, it should work.
            }
        };
    </script>
</body>

</html>
