<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도교육청 정보자원통합 중간보고회 | PyhgoShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #3b82f6;
            --text-color: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            /* Disable selection */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #050505 100%);
        }

        .container {
            width: 98%;
            /* Increased width */
            max-width: 1600px;
            height: 96vh;
            /* Increased height */
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--glass-border);
            gap: 20px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            background: linear-gradient(to right, #93c5fd, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.9;
        }

        /* Navigation Guide Badge */
        .nav-guide {
            padding: 4px 12px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 20px;
            font-size: 0.8rem;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }

        .nav-guide::before {
            content: "ℹ";
            font-weight: bold;
        }

        .viewer-wrapper {
            position: relative;
            flex-grow: 1;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* The Protective Mask */
        .protection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 40px);
            /* Leave space for scrollbar area */
            height: 100%;
            background: rgba(128, 128, 128, 0.05);
            /* Subtle gray mask */
            z-index: 10;
            cursor: default;
        }

        footer {
            margin-top: 4px;
            font-size: 0.75rem;
            opacity: 0.4;
            text-align: center;
        }

        @keyframes pulse {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.02);
            }

            100% {
                opacity: 0.7;
                transform: scale(1);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                padding: 8px;
            }

            h1 {
                font-size: 1rem;
            }

            .nav-guide {
                display: none;
            }
        }
    </style>
</head>

<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
    <div class="container">
        <header>
            <h1>경기도교육청 정보자원통합 중간보고회</h1>
            <div class="nav-guide">우측의 스크롤바를 클릭하거나 드래그하여 이동하세요</div>
        </header>

        <div class="viewer-wrapper">
            <!-- Protective overlay that blocks clicks -->
            <div class="protection-overlay" id="overlay"></div>

            <iframe src="geoci_225report.pdf#toolbar=0&navpanes=0&scrollbar=1" class="pdf-viewer" id="viewer">
                <p>Your browser does not support iframes.</p>
            </iframe>
        </div>

        <footer>
            &copy; 2026 PyhgoShift Security Protocol. Authorized access only.<br>
            Last Deployed: 2026-02-24 18:08:00 (KST)
        </footer>
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const iframe = document.getElementById('viewer');

        // Forward wheel events from overlay to iframe
        overlay.addEventListener('wheel', function (e) {
            try {
                // PDF viewers inside iframes are tricky. 
                // We try to scroll the contentWindow if accessible.
                iframe.contentWindow.scrollBy(0, e.deltaY);
            } catch (err) {
                // Cross-origin catch, though same-origin should be fine.
            }
        }, { passive: true });

        // Additional protection layer
        document.addEventListener('keydown', function (e) {
            if (e.key === 'PrintScreen') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.key === 's') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') e.preventDefault();
            if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'i')) e.preventDefault();
        });

        iframe.onload = function () {
            try {
                iframe.contentWindow.addEventListener('contextmenu', function (e) {
                    e.preventDefault();
                }, false);
            } catch (e) { }
        };
    </script>
</body>

</html>
