<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진행 상황 보기</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <!-- Image Map Generated by http://www.image-map.net/ -->
    <img src="view.png" usemap="#image-map" id="map-image">

    <map name="image-map">
        <area target="" alt="전체진행상황보기" title="전체진행상황보기"
            href="https://docs.google.com/spreadsheets/d/1xaP7fzGtVNCExBOVgmvfG-V5OV0CKf0LnFzgPd2tJE8/edit?gid=194872447#gid=194872447"
            coords="201,328,1275,1385" shape="rect">
        <!-- Fixed coordinates order: 2530,355 -> 1482,355 -->
        <area target="" alt="지역청만보기" title="지역청만보기"
            href="https://docs.google.com/spreadsheets/d/1xaP7fzGtVNCExBOVgmvfG-V5OV0CKf0LnFzgPd2tJE8/edit?gid=59789816#gid=59789816"
            coords="1482,355,2530,1359" shape="rect">
    </map>

    <script>
        // Image Map Resizer
        window.onload = function () {
            var image = document.getElementById('map-image');
            var map = document.querySelector('map[name="image-map"]');
            var areas = map.getElementsByTagName('area');
            var originalWidth = 2752; // Original width of view.png

            function resizeMap() {
                var currentWidth = image.clientWidth;
                var ratio = currentWidth / originalWidth;

                for (var i = 0; i < areas.length; i++) {
                    var area = areas[i];
                    if (!area.dataset.originalCoords) {
                        area.dataset.originalCoords = area.getAttribute('coords');
                    }
                    var coords = area.dataset.originalCoords.split(',');
                    var newCoords = coords.map(function (coord) {
                        return Math.round(coord * ratio);
                    });
                    area.setAttribute('coords', newCoords.join(','));
                }
            }

            window.addEventListener('resize', resizeMap);
            // Initial call
            if (image.complete) {
                resizeMap();
            } else {
                image.addEventListener('load', resizeMap);
            }
        };
    </script>
</body>

</html>
