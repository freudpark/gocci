<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도교육청 정보자원통합 중간보고회 (보안 모드) | PyhgoShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #3b82f6;
            --text-color: #f1f5f9;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden !important;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #050505 100%);
        }

        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--accent-color);
            z-index: 1000;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1100;
        }

        .btn-box {
            display: flex;
            gap: 10px;
        }

        .btn {
            width: 50px;
            height: 50px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.8);
            color: #fff;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto !important;
        }

        .btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.6);
        }

        .btn:active {
            transform: scale(0.9);
        }

        .page-info {
            font-size: 1rem;
            color: #93c5fd;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            min-width: 70px;
            text-align: center;
        }

        .viewer-stage {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .viewer-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            will-change: transform;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        .protection-wall {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 500;
            background: transparent;
        }

        footer {
            padding: 8px 0;
            font-size: 0.7rem;
            opacity: 0.2;
            text-align: center;
            background: #000;
            border-top: 1px solid var(--glass-border);
            z-index: 1000;
        }
    </style>
</head>

<body oncontextmenu="return false" onselectstart="return false">
    <div class="container">
        <header>
            <h1>경기도교육청 정보자원통합 중간보고회</h1>
            <div class="nav-controls">
                <div class="page-info" id="pageDisplay">P.01</div>
                <div class="btn-box">
                    <button class="btn" title="이전" onclick="prevPage()">▲</button>
                    <button class="btn" title="다음" onclick="nextPage()">▼</button>
                </div>
            </div>
        </header>

        <div class="viewer-stage">
            <div class="protection-wall" id="protectionLayer"></div>

            <div class="viewer-layer" id="viewerLayer">
                <iframe src="geoci_225report.pdf?v=1005#toolbar=0&navpanes=0&view=FitH&page=1" class="pdf-viewer"
                    id="pdfViewer"></iframe>
            </div>
        </div>

        <footer>
            Security Protocol Active | Last Updated: 2026-02-25 10:05 (KST)
        </footer>
    </div>

    <script>
        let currentPage = 1;
        let isTransitioning = false;
        const layer = document.getElementById('viewerLayer');
        const viewer = document.getElementById('pdfViewer');
        const display = document.getElementById('pageDisplay');
        const protection = document.getElementById('protectionLayer');

        function slideToPage(direction) {
            if (isTransitioning) return;
            isTransitioning = true;

            const distance = direction === 'next' ? -100 : 100;

            // 1. First, slide the current layer out
            layer.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            layer.style.transform = `translateY(${distance}px)`;
            layer.style.opacity = '0';

            setTimeout(() => {
                // 2. Teleport to start position for the incoming slide
                layer.style.transition = 'none';
                layer.style.transform = `translateY(${-distance}px)`;

                // 3. Update Content - FORCE RELOAD with UNIQUE parameter to ensure jump
                const ts = Date.now();
                viewer.src = `geoci_225report.pdf?t=${ts}#toolbar=0&navpanes=0&view=FitH&page=${currentPage}`;
                display.innerText = `P.${currentPage.toString().padStart(2, '0')}`;

                // 4. Final slide-in
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        layer.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s';
                        layer.style.transform = 'translateY(0)';
                        layer.style.opacity = '1';
                        isTransitioning = false;
                    }, 50);
                });
            }, 350);
        }

        function nextPage() {
            currentPage++;
            slideToPage('next');
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                slideToPage('prev');
            }
        }

        // Wheel to Scroll Effect
        let lastWheelTime = 0;
        protection.addEventListener('wheel', function (e) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastWheelTime < 1200) return; // Throttle wheel navigation

            if (e.deltaY > 0) {
                nextPage();
            } else {
                prevPage();
            }
            lastWheelTime = now;
        }, { passive: false });

        // Security: Block all clicks except on buttons
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.btn')) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        // Security: Key locks
        window.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey || e.key === 'F12') e.preventDefault();

            if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) nextPage();
            if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) prevPage();
        });
    </script>
</body>

</html>
