<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도교육청 정보자원통합 중간보고회 (보안 모드) | PyhgoShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #3b82f6;
            --text-color: #f1f5f9;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden !important;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #050505 100%);
        }

        /* Essential: Hide all scrollbars */
        ::-webkit-scrollbar {
            display: none;
        }

        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--accent-color);
            z-index: 500;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(to right, #93c5fd, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 600;
        }

        .btn {
            width: 44px;
            height: 44px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto !important;
        }

        .btn:hover {
            background: var(--accent-color);
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .page-info {
            font-size: 0.9rem;
            color: #93c5fd;
            font-family: monospace;
            min-width: 60px;
            text-align: center;
            font-weight: 600;
        }

        .viewer-container {
            flex-grow: 1;
            width: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
            /* This clips the sliding wrapper */
        }

        .viewer-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        .protection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 400;
            background: transparent;
        }

        footer {
            padding: 8px 0;
            font-size: 0.7rem;
            opacity: 0.2;
            text-align: center;
            background: #000;
            border-top: 1px solid var(--glass-border);
            z-index: 500;
        }

        /* Sliding classes */
        .slide-up {
            transform: translateY(-100%);
        }

        .slide-down {
            transform: translateY(100%);
        }

        .slide-in {
            transform: translateY(0);
        }
    </style>
</head>

<body oncontextmenu="return false" onselectstart="return false">
    <div class="container">
        <header>
            <h1>경기도교육청 정보자원통합 중간보고회</h1>
            <div class="nav-controls">
                <button class="btn" title="이전" onclick="prevPage()">▲</button>
                <div class="page-info" id="pageDisplay">P.01</div>
                <button class="btn" title="다음" onclick="nextPage()">▼</button>
            </div>
        </header>

        <div class="viewer-container">
            <div class="protection-overlay" id="protectionLayer"></div>

            <div class="viewer-wrapper" id="viewerWrapper">
                <iframe src="geoci_225report.pdf?v=0955#toolbar=0&navpanes=0&view=FitH&page=1" class="pdf-viewer"
                    id="pdfViewer"></iframe>
            </div>
        </div>

        <footer>
            &copy; 2026 PyhgoShift Security Protocol. Authorized Access Only.<br>
            Last Deployed: 2026-02-25 09:55 (KST)
        </footer>
    </div>

    <script>
        let currentPage = 1;
        const wrapper = document.getElementById('viewerWrapper');
        const viewer = document.getElementById('pdfViewer');
        const display = document.getElementById('pageDisplay');
        const layer = document.getElementById('protectionLayer');

        function updatePage(direction) {
            // Simulated scrolling effect using CSS transitions
            const slideClass = direction === 'next' ? 'slide-up' : 'slide-down';

            // 1. Move current out
            wrapper.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s';
            wrapper.style.transform = (direction === 'next' ? 'translateY(-30px)' : 'translateY(30px)');
            wrapper.style.opacity = '0';

            setTimeout(() => {
                // 2. Teleport to opposite side
                wrapper.style.transition = 'none';
                wrapper.style.transform = (direction === 'next' ? 'translateY(30px)' : 'translateY(-30px)');

                // 3. Update Content
                viewer.src = `geoci_225report.pdf?v=0955#toolbar=0&navpanes=0&view=FitH&page=${currentPage}`;
                display.innerText = `P.${currentPage.toString().padStart(2, '0')}`;

                // 4. Slide back in
                setTimeout(() => {
                    wrapper.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s';
                    wrapper.style.transform = 'translateY(0)';
                    wrapper.style.opacity = '1';
                }, 50);
            }, 400);
        }

        function nextPage() {
            currentPage++;
            updatePage('next');
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePage('prev');
            }
        }

        // Wheel Support with Throttle
        let lastWheelTime = 0;
        layer.addEventListener('wheel', function (e) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastWheelTime < 1000) return;

            if (e.deltaY > 0) {
                nextPage();
            } else {
                prevPage();
            }
            lastWheelTime = now;
        }, { passive: false });

        // Interaction blocks
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('btn')) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        window.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey) {
                if (['s', 'p', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
        });
    </script>
</body>

</html>
