<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도교육청 정보자원통합 중간보고회 (보안 모드) | PyhgoShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #3b82f6;
            --text-color: #f1f5f9;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none !important;
            -webkit-user-select: none !important;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #050505 100%);
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--accent-color);
            z-index: 300;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(to right, #93c5fd, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 400;
        }

        .btn {
            padding: 8px 20px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            pointer-events: auto !important;
            /* Force interactive */
        }

        .btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .page-info {
            font-size: 0.9rem;
            color: #93c5fd;
            min-width: 80px;
            text-align: center;
        }

        .viewer-wrapper {
            flex-grow: 1;
            width: 100%;
            background: #000;
            position: relative;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        .protection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: transparent;
            cursor: default;
        }

        footer {
            padding: 6px 0;
            font-size: 0.7rem;
            opacity: 0.3;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid var(--glass-border);
        }
    </style>
</head>

<body oncontextmenu="return false" onselectstart="return false">
    <div class="container">
        <header>
            <h1>경기도교육청 정보자원통합 중간보고회 (보안 모드)</h1>
            <div class="nav-controls">
                <button class="btn" onclick="prevPage()">이전 페이지</button>
                <div class="page-info" id="pageDisplay">Page: 1</div>
                <button class="btn" onclick="nextPage()">다음 페이지</button>
            </div>
        </header>

        <div class="viewer-wrapper">
            <div class="protection-overlay" id="protectionLayer"></div>
            <iframe src="geoci_225report.pdf#toolbar=0&navpanes=0&view=FitH&page=1" class="pdf-viewer"
                id="pdfViewer"></iframe>
        </div>

        <footer>
            &copy; 2026 PyhgoShift Security Protocol. Authorized Access Only.<br>
            Security Level: MAXIMUM | Last Deployed: 2026-02-25 09:20 (KST)
        </footer>
    </div>

    <script>
        let currentPage = 1;
        const viewer = document.getElementById('pdfViewer');
        const display = document.getElementById('pageDisplay');
        const layer = document.getElementById('protectionLayer');

        function updatePage() {
            viewer.src = `geoci_225report.pdf#toolbar=0&navpanes=0&view=FitH&page=${currentPage}`;
            display.innerText = `Page: ${currentPage}`;
        }

        function nextPage() {
            currentPage++;
            updatePage();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                updatePage();
            }
        }

        // Wheel Support: Throttle it to simulate page turns
        let lastWheelTime = 0;
        layer.addEventListener('wheel', function (e) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastWheelTime < 500) return; // Debounce 500ms

            if (e.deltaY > 0) {
                nextPage();
            } else {
                prevPage();
            }
            lastWheelTime = now;
        }, { passive: false });

        // Kill Clicks on Overlay and Header except Buttons
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('btn')) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        // Standard Keyboard Locks
        window.addEventListener('keydown', function (e) {
            if (e.key === 'PrintScreen') e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
                if (['s', 'p', 'u'].includes(e.key.toLowerCase())) e.preventDefault();
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();

            // Arrow navigation
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
        });
    </script>
</body>

</html>
