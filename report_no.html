<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기도교육청 정보자원통합 중간보고회 (보안 모드) | PyhgoShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #3b82f6;
            --text-color: #f1f5f9;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none !important;
            -webkit-user-select: none !important;
            -ms-user-select: none !important;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #050505 100%);
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            background: linear-gradient(to right, #ef4444, #f59e0b);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .viewer-wrapper {
            flex-grow: 1;
            width: 100%;
            background: #000;
            position: relative;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 
           Super Protection Overlay 
           This blocks all mouse clicks, drags, and selections.
        */
        .protection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: transparent;
            cursor: default;
        }

        footer {
            padding: 6px 0;
            font-size: 0.7rem;
            opacity: 0.3;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid var(--glass-border);
        }
    </style>
</head>

<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
    <div class="container">
        <header>
            <h1>경기도교육청 정보자원통합 중간보고회 (보안 강화 모드)</h1>
        </header>

        <div class="viewer-wrapper">
            <!-- This overlay stops ALL direct interaction with the PDF -->
            <div class="protection-overlay" id="protectionLayer"></div>

            <iframe src="geoci_225report.pdf#toolbar=0&navpanes=0&view=FitH" class="pdf-viewer" id="pdfViewer">
                <p>브라우저가 PDF 뷰어를 지원하지 않습니다.</p>
            </iframe>
        </div>

        <footer>
            &copy; 2026 PyhgoShift Security Protocol. Interaction strictly limited.<br>
            Security Level: MAXIMUM | Last Deployed: 2026-02-25 09:12 (KST)
        </footer>
    </div>

    <script>
        const layer = document.getElementById('protectionLayer');
        const viewer = document.getElementById('pdfViewer');

        /**
         * 1. Mouse Wheel Injection
         * Forward wheel events to the hidden iframe to allow scrolling.
         */
        layer.addEventListener('wheel', function (e) {
            e.preventDefault();
            try {
                // Adjust scroll multiplier for better feel
                const amount = e.deltaY;
                viewer.contentWindow.scrollBy(0, amount);
            } catch (err) {
                // Note: Accessing contentWindow.scrollBy might be blocked 
                // in some PDF viewer implementations via iframe.
                // Reverting to manual scroll attempt if browser permits.
            }
        }, { passive: false });

        /**
         * 2. Comprehensive Keyboard Lock
         * Disable Printing, Saving, and DevTools.
         */
        window.addEventListener('keydown', function (e) {
            // PrintScreen
            if (e.key === 'PrintScreen') {
                e.preventDefault();
                alert('캡처가 금지된 문서입니다.');
            }
            // Ctrl+S, Ctrl+P, Ctrl+U (Source), F12, Ctrl+Shift+I
            if (e.ctrlKey || e.metaKey) {
                if (['s', 'p', 'u'].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                }
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
        });

        /**
         * 3. Kill all clicks on the entire document
         */
        document.addEventListener('mousedown', (e) => e.preventDefault(), true);
        document.addEventListener('click', (e) => e.preventDefault(), true);
    </script>
</body>

</html>
