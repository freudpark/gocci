    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #3b82f6;
            --text-color: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #111827 0%, #050505 100%);
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            background: linear-gradient(to right, #93c5fd, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .viewer-wrapper {
            flex-grow: 1;
            width: 100%;
            background: #000;
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            padding: 8px 0;
            font-size: 0.75rem;
            opacity: 0.4;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid var(--glass-border);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1rem;
            }
        }
    </style>

<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

    <script>
        // Additional protection layer
        document.addEventListener('keydown', function (e) {
            if (e.key === 'PrintScreen') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.key === 's') e.preventDefault();
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') e.preventDefault();
            if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'i')) e.preventDefault();
        });

        const iframe = document.getElementById('viewer');
        iframe.onload = function () {
            try {
                // Attempt to disable right-click inside the iframe if same-origin
                iframe.contentWindow.addEventListener('contextmenu', function (e) {
                    e.preventDefault();
                }, false);
            } catch (e) { }
        };
    </script>
