<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: flex-start;

    background-image: url('./timebb.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    font-family: 'Pretendard', sans-serif;
    color: white;
}

/* 텍스트 영역 */
.container {
    font-size: 150px;
    font-weight: 900;
    text-align: left;

    padding-left: 100px;

    text-shadow: 4px 4px 15px rgba(0,0,0,0.8);
}

.line {
    margin: 50px 0;
}

/* 🌸 꽃잎 */
.petal {
    position: absolute;
    top: -50px;
    width: 15px;
    height: 15px;
    background: pink;
    border-radius: 50% 50% 50% 0;
    opacity: 0.8;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(0) translateX(0) rotate(0deg);
    }
    100% {
        transform: translateY(110vh) translateX(120px) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="line" id="current">현재시간 : --</div>
    <div class="line" id="remain">시작시간 : --</div>
</div>

<script>

// 🌸 꽃잎 생성
function createPetal() {
    const petal = document.createElement("div");
    petal.classList.add("petal");

    petal.style.left = Math.random() * window.innerWidth + "px";
    petal.style.animationDuration = (4 + Math.random() * 6) + "s";
    petal.style.transform = "scale(" + (0.5 + Math.random()) + ")";

    document.body.appendChild(petal);

    setTimeout(() => petal.remove(), 10000);
}
setInterval(createPetal, 250);


// ⏰ 기준 시간 (2026-04-03 18:00 KST)
const target = new Date("2026-04-03T18:00:00+09:00");

function update() {
    const now = new Date();

    const currentTime =
        now.getHours().toString().padStart(2, '0') + ":" +
        now.getMinutes().toString().padStart(2, '0') + ":" +
        now.getSeconds().toString().padStart(2, '0');

    document.getElementById("current").innerHTML =
        "<span style='color:#0047AB;'>현재시간 : " + currentTime + "</span>";

    const diff = target - now;

    if (diff <= 0) {
        document.getElementById("remain").innerHTML =
            "🔴 LIVE 진행중";
        return;
    }

    const h = Math.floor(diff / (1000*60*60));
    const m = Math.floor((diff / (1000*60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById("remain").innerHTML =
    "<span style='color:#FFFF00;'>시작시간 : -" + h + "시간 " + m + "분 " + s + "초</span>";
}

setInterval(update, 1000);
update();

</script>

</body>
</html>
